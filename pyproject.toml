[project]
name = "handshake"
version = "0.1.0"
description = "Handshake — cross-platform, GUI-only, peer-to-peer encrypted chat. No server, no cloud, no accounts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Handshake" }]
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23",
    "PySide6>=6.6",
    "qrcode>=7",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
handshake = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
